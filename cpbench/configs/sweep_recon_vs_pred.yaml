learners:
- ae
- vae
- jepa_separate
- jepa_shared
- cpc
- ts2vec
seeds:
- 0
- 1
- 2
hparams:
  hp.window:
  - 64
  hp.gap:
  - 32
overrides:
- hp.d=16
- hp.batch=256
- hp.lr=0.0003
- hp.schedule=cosine
- hp.min_lr=0.05
- hp.stream_version=2
- hp.steps=20000
- hp.warmup=1000
- hp.eval_every=2000
- hp.ckpt_every=2000
- hp.eval_detectors=[gmm,hmm]
- hp.keep_ckpts=[2000,5000,20000]
